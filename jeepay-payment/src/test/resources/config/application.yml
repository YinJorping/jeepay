# ============================================================
# 回调模块测试配置
# @SpringBootTest 使用此配置连接 Docker 中的 MySQL/Redis/RocketMQ
# ============================================================

server:
  servlet:
    context-path: /

spring:
  application:
    name: jeepay-payment-test
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/jeepaydb?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
  cache:
    type: redis
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 3
      timeout: 1000
      password:
  freemarker:
    template-loader-path: classpath:/templates
    suffix: .ftl
    settings:
      classic_compatible: true
      number_format: '#'

logging:
  level:
    root: info
    com.jeequan.jeepay: info

isys:
  allow-cors: true
  cache-config: true
  oss:
    file-root-path: ./upload
    file-public-path: ${isys.oss.file-root-path}/public
    file-private-path: ${isys.oss.file-root-path}/private
    service-type: local
  mq:
    vender: rocketMQ

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: PID_JEEPAY_TEST
    send-message-timeout: 10000
