name: CI

on:
  push:
    branches: [master, dev, test-dev]
  pull_request:
    branches: [master, dev]

jobs:
  shell-assertions:
    name: Shell 安装脚本断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run docs/install/test_*.sh
        run: |
          set -e
          for t in docs/install/test_*.sh; do
            echo "== Running $t =="
            sh "$t"
          done
      - name: Syntax check install/uninstall
        run: |
          bash -n docs/install/install.sh
          bash -n docs/install/uninstall.sh

  maven-compile:
    name: Maven 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile（skip tests）
        run: mvn -B -DskipTests -T 1C clean compile
      - name: Compile tests
        run: mvn -B -DskipTests -T 1C test-compile

  integration-test:
    name: 集成测试（支付 + 认证，84 用例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 复用 docker-compose.yml 的基础设施定义，与本地开发环境完全一致。
      # 只拉起 4 个依赖服务（mysql/redis/rocketmq-namesrv/rocketmq-broker），不构建业务应用镜像。
      # --wait 等待各服务 healthcheck 通过（RocketMQ broker start_period 较长，约 2~3 分钟）。
      - name: 启动基础设施（MySQL/Redis/RocketMQ）
        run: docker compose up -d --wait mysql redis rocketmq-namesrv rocketmq-broker

      # 基础设施起不来时把容器状态和 MySQL 日志打出来，
      # 否则只能拿到一句 "container jeepay-mysql is unhealthy"，无从判断是初始化慢还是初始化报错。
      - name: 基础设施启动失败时转储日志
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color mysql || true

      # 加载幂等 seed 数据。MySQL 已在首次启动时通过 initdb 挂载执行 docs/sql/init.sql。
      - name: 加载测试 seed 数据
        run: |
          for sql in docs/test/prepare-*.sql; do
            echo "  > $(basename "$sql")"
            docker compose exec -T mysql mysql -uroot -prootroot jeepaydb < "$sql"
          done

      - name: 运行集成测试
        run: mvn -B -Dsurefire.failIfNoSpecifiedTests=false -pl jeepay-payment,jeepay-merchant -am test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            jeepay-payment/target/surefire-reports/
            jeepay-merchant/target/surefire-reports/
          retention-days: 7
